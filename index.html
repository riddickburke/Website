<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Riddick Burke-Garrison</title>
<style>
:root{color-scheme:dark;--bg:#0e0f11;--panel:#15171a;--line:#25282d;--ink:#e8e6e3;--mute:#8d9299;--acc:#f0a23a;
--mono:ui-monospace,"JetBrains Mono","SF Mono",Menlo,Consolas,monospace;--sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;scroll-padding-top:4.5rem}
body{background:var(--bg);color:var(--ink);font:16px/1.65 var(--sans);border-top:3px solid var(--acc);-webkit-font-smoothing:antialiased;counter-reset:s}
a{color:inherit;text-underline-offset:3px}
a:hover{color:var(--acc)}
:focus-visible{outline:2px solid var(--acc);outline-offset:3px}
.wrap{max-width:860px;margin:0 auto;padding:0 1.5rem}
nav{position:sticky;top:0;z-index:5;background:rgba(14,15,17,.88);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
nav .wrap{display:flex;justify-content:space-between;align-items:center;height:3.25rem;font:.85rem var(--mono)}
nav .logo{color:var(--acc);text-decoration:none}
nav ul{display:flex;gap:1.5rem;list-style:none}
nav ul a{color:var(--mute);text-decoration:none}
nav ul a:hover{color:var(--ink)}
header{padding:4.5rem 0 3rem;display:flex;gap:2rem;align-items:center}
.photo{width:128px;height:128px;flex:none;border-radius:8px;object-fit:cover;border:1px solid var(--line);box-shadow:6px 6px 0 var(--acc)}
.kicker{font:.85rem var(--mono);color:var(--acc)}
.kicker::after{content:"";display:inline-block;width:.55em;height:1em;margin-left:.2em;vertical-align:-.15em;background:var(--acc);animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
@media (prefers-reduced-motion:reduce){.kicker::after{animation:none}html{scroll-behavior:auto}}
h1{font-size:clamp(2rem,6vw,3rem);line-height:1.1;letter-spacing:-.02em;margin:.4rem 0}
.tag{color:var(--mute)}
.contact{display:flex;flex-wrap:wrap;gap:.4rem 1.25rem;margin-top:1rem;font:.85rem var(--mono);color:var(--mute)}
.contact a{color:var(--ink)}
section{padding:2.5rem 0;border-top:1px solid var(--line)}
section[hidden]{display:none}
h2{font:500 .9rem var(--mono);color:var(--acc);margin-bottom:1.5rem}
h2::before{counter-increment:s;content:"0" counter(s) " / ";color:var(--mute)}
.about p+p{margin-top:1rem}
.about{max-width:62ch;font-size:1.05rem}
.card{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--line);border-radius:6px;padding:1.2rem 1.4rem;transition:border-color .15s}
.card:hover{border-left-color:var(--acc)}
.card+.card{margin-top:1rem}
.head{display:flex;justify-content:space-between;gap:1rem;flex-wrap:wrap;align-items:baseline}
.head h3{font-size:1.05rem}
.meta{font:.8rem var(--mono);color:var(--mute)}
.sub{color:var(--mute);font-size:.92rem}
.desc{margin-top:.7rem;font-size:.95rem;max-width:68ch}
.tags{display:flex;flex-wrap:wrap;gap:.4rem;margin-top:.9rem;list-style:none}
.tags li{font:.75rem var(--mono);padding:.1rem .55rem;border:1px solid var(--line);border-radius:4px;color:var(--mute)}
.certs{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:1rem}
.certs .card+.card{margin-top:0}
.certs img{width:72px;height:72px;object-fit:contain;margin-bottom:.8rem;display:block}
footer{padding:2rem 0 3rem;border-top:1px solid var(--line);font:.8rem var(--mono);color:var(--mute)}
#status{padding:4rem 1.5rem;text-align:center;color:var(--mute)}
@media (max-width:600px){header{flex-direction:column;align-items:flex-start;padding-top:3rem}nav ul{gap:1rem}}
</style>
</head>
<body>
<nav><div class="wrap"><a class="logo" href="#top" id="logo">~/</a>
<ul><li><a href="#about">about</a></li><li><a href="#experience">experience</a></li><li><a href="#certifications">certifications</a></li></ul></div></nav>
<div id="status">Loading…</div>
<main class="wrap" id="top" hidden>
<header>
  <img class="photo" id="photo" alt="" hidden>
  <div><div class="kicker" id="headline"></div><h1 id="name"></h1><p class="tag" id="tagline"></p><div class="contact" id="contact"></div></div>
</header>
<section id="about" hidden><h2>about</h2><div class="about" id="about-body"></div></section>
<section id="experience" hidden><h2>experience</h2><div id="exp-list"></div></section>
<section id="certifications" hidden><h2>certifications</h2><div class="certs" id="cert-list"></div></section>
<footer id="foot"></footer>
</main>
<script>
const $=id=>document.getElementById(id);
const h=(t,a={},...k)=>{const e=document.createElement(t);for(const[x,v]of Object.entries(a))if(v)x==='class'?e.className=v:e.setAttribute(x,v);k.flat().forEach(c=>e.append(c));return e};
// block javascript:/data: links coming from the JSON
const safe=u=>{u=(u||'').trim();return/^[a-z][a-z0-9+.-]*:/i.test(u)&&!/^(https?|mailto|tel):/i.test(u)?'':u};
const link=(href,text)=>h('a',{href:safe(href),target:/^https?:/i.test(href)?'_blank':'',rel:'noopener'},text);

fetch('data.json?t='+Date.now()).then(r=>{if(!r.ok)throw 0;return r.json()}).then(D=>{
  const p=D.profile||{};
  document.title=[p.name,p.headline].filter(Boolean).join(' · ')||'Portfolio';
  $('headline').textContent='> '+(p.headline||'');
  $('name').textContent=p.name||'';
  $('tagline').textContent=p.tagline||'';
  $('logo').textContent='~/'+(p.name||'').split(' ')[0].toLowerCase();
  if(p.photo){const i=$('photo');i.onload=()=>i.hidden=false;i.src=safe(p.photo);i.alt='Portrait of '+(p.name||'me')}
  const c=$('contact');
  if(p.location)c.append(h('span',{},p.location));
  if(p.email)c.append(link('mailto:'+p.email,p.email));
  if(p.phone)c.append(link('tel:'+p.phone.replace(/[^\d+]/g,''),p.phone));
  (p.links||[]).forEach(l=>l.url&&c.append(link(l.url,l.label||l.url)));

  const show=id=>$(id).hidden=false;
  if(D.about){D.about.split(/\n\s*\n/).forEach(t=>$('about-body').append(h('p',{},t)));show('about')}
  (D.experience||[]).forEach(e=>$('exp-list').append(h('article',{class:'card'},
    h('div',{class:'head'},h('h3',{},e.role||''),e.period&&h('span',{class:'meta'},e.period)),
    e.org&&h('div',{class:'sub'},e.org),
    e.desc&&h('p',{class:'desc'},e.desc),
    e.tags&&e.tags.length&&h('ul',{class:'tags'},e.tags.map(t=>h('li',{},t))))));
  if((D.experience||[]).length)show('experience');
  (D.certifications||[]).forEach(x=>$('cert-list').append(h('article',{class:'card'},
    x.image&&h('img',{src:safe(x.image),alt:'',loading:'lazy'}),
    h('h3',{},x.url?link(x.url,x.name):x.name),
    h('div',{class:'sub'},[x.issuer,x.date].filter(Boolean).join(' · ')),
    x.credentialId&&h('div',{class:'meta'},'ID '+x.credentialId))));
  if((D.certifications||[]).length)show('certifications');
  $('foot').textContent='© '+new Date().getFullYear()+' '+(p.name||'');
  $('status').hidden=true;document.querySelector('main').hidden=false;
}).catch(()=>{$('status').textContent='Could not load data.json. If you opened this file directly, run a local server: python3 -m http.server'});
</script>
</body>
</html>
