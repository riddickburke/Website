<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="robots" content="noindex">
<title>Site editor</title>
<style>
:root{color-scheme:dark;--bg:#0e0f11;--panel:#15171a;--line:#25282d;--ink:#e8e6e3;--mute:#8d9299;--acc:#f0a23a;--bad:#e5645a;
--mono:ui-monospace,"JetBrains Mono","SF Mono",Menlo,Consolas,monospace;--sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--sans);border-top:3px solid var(--acc)}
.wrap{max-width:820px;margin:0 auto;padding:0 1.25rem 4rem}
.top{position:sticky;top:0;z-index:5;background:rgba(14,15,17,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;gap:.6rem;align-items:center;flex-wrap:wrap;padding:.75rem 1.25rem}
.top h1{font:500 .95rem var(--mono);color:var(--acc);margin-right:auto}
button,.btn{font:500 .8rem var(--mono);color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:5px;padding:.4rem .75rem;cursor:pointer}
button:hover,.btn:hover{border-color:var(--acc)}
.primary{background:var(--acc);color:#111;border-color:var(--acc)}
.danger:hover{border-color:var(--bad);color:var(--bad)}
details{margin-top:1.25rem;border:1px solid var(--line);border-radius:6px;background:var(--panel)}
summary{padding:.8rem 1rem;font:500 .85rem var(--mono);color:var(--acc);cursor:pointer}
.body{padding:0 1rem 1rem}
label{display:block;margin-top:.8rem}
label span{display:block;font:.75rem var(--mono);color:var(--mute);margin-bottom:.2rem}
input,textarea{width:100%;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:5px;padding:.5rem .65rem;font:inherit}
input:focus,textarea:focus{outline:none;border-color:var(--acc)}
textarea{resize:vertical}
.item{margin-top:1rem;padding:.2rem 1rem 1rem;border:1px solid var(--line);border-left:3px solid var(--acc);border-radius:5px;background:#121416}
.bar{display:flex;gap:.4rem;align-items:center;margin-top:.8rem}
.bar b{margin-right:auto;font-size:.9rem}
.add{margin-top:1rem}
#out{font:.75rem/1.5 var(--mono);height:260px}
.hint{color:var(--mute);font-size:.85rem;margin-top:1rem}
#msg{font:.8rem var(--mono);color:var(--mute)}
</style>
</head>
<body>
<div class="top"><div class="wrap">
  <h1>site editor</h1><span id="msg"></span>
  <label class="btn" style="margin:0">Open JSON<input type="file" id="file" accept=".json,application/json" hidden></label>
  <button id="copy">Copy JSON</button>
  <button id="dl" class="primary">Download data.json</button>
</div></div>
<div class="wrap">
  <p class="hint">Edit below, download <b>data.json</b>, then replace the file in your repo (GitHub → Add file → Upload files). Use <b>Open JSON</b> to load an existing file back in.</p>
  <div id="form"></div>
  <details><summary>raw json (read-only)</summary><div class="body"><textarea id="out" readonly></textarea></div></details>
</div>
<script>
const $=id=>document.getElementById(id);
const h=(t,a={},...k)=>{const e=document.createElement(t);for(const[x,v]of Object.entries(a))if(v!=null)x==='class'?e.className=v:e.setAttribute(x,v);k.flat().forEach(c=>e.append(c));return e};
const PROFILE=[['name','Name'],['headline','Headline (small line above name)'],['tagline','Tagline'],['location','Location'],['email','Email'],['phone','Phone'],['photo','Photo file or URL (e.g. photo.jpg)']];
const LINK=[['label','Label'],['url','URL']];
const EXP=[['role','Role'],['org','Organization'],['period','Period (e.g. 2024 – Present)'],['desc','Description','area'],['tags','Tags (comma separated)','tags']];
const CERT=[['name','Name'],['issuer','Issuer'],['date','Date'],['url','Credential URL'],['credentialId','Credential ID'],['image','Badge image file or URL']];
let D={},dirty=false;

const norm=d=>{d=d&&typeof d==='object'?d:{};d.profile=d.profile||{};d.profile.links=d.profile.links||[];d.about=d.about||'';d.experience=d.experience||[];d.certifications=d.certifications||[];return d};
const sync=()=>{dirty=true;$('out').value=JSON.stringify(D,null,2)};
const mkbtn=(t,f,c='')=>{const b=h('button',{class:c,type:'button'},t);b.onclick=f;return b};
const mv=(a,n,d)=>{const m=n+d;if(m<0||m>=a.length)return;[a[n],a[m]]=[a[m],a[n]];render();sync()};

function field(o,[k,label,type]){
  const i=type==='area'?h('textarea',{rows:5}):h('input',{type:'text'});
  i.value=type==='tags'?(o[k]||[]).join(', '):(o[k]||'');
  i.oninput=()=>{o[k]=type==='tags'?i.value.split(',').map(s=>s.trim()).filter(Boolean):i.value;sync()};
  return h('label',{},h('span',{},label),i);
}
function list(arr,spec,blank,title){
  const box=h('div');
  arr.forEach((o,n)=>box.append(h('div',{class:'item'},
    h('div',{class:'bar'},h('b',{},title(o)||'New entry'),
      mkbtn('↑',()=>mv(arr,n,-1)),mkbtn('↓',()=>mv(arr,n,1)),
      mkbtn('Delete',()=>{if(confirm('Delete this entry?')){arr.splice(n,1);render();sync()}},'danger')),
    spec.map(f=>field(o,f)))));
  box.append(mkbtn('+ Add',()=>{arr.push(structuredClone(blank));render();sync()},'add'));
  return box;
}
const sec=(t,open,...k)=>h('details',open?{open:''}:{},h('summary',{},t),h('div',{class:'body'},k));

function render(){
  const f=$('form');f.replaceChildren();
  const about=h('textarea',{rows:6});about.value=D.about;about.oninput=()=>{D.about=about.value;sync()};
  f.append(
    sec('profile',true,PROFILE.map(x=>field(D.profile,x)),
      h('label',{},h('span',{},'Links')),list(D.profile.links,LINK,{label:'',url:''},o=>o.label)),
    sec('about',true,h('label',{},h('span',{},'About me (blank line = new paragraph)'),about)),
    sec('experience',true,list(D.experience,EXP,{role:'',org:'',period:'',desc:'',tags:[]},o=>o.role)),
    sec('certifications',true,list(D.certifications,CERT,{name:'',issuer:'',date:'',url:'',credentialId:'',image:''},o=>o.name)));
}
function load(d){D=norm(d);render();$('out').value=JSON.stringify(D,null,2)}

$('file').onchange=e=>{const r=new FileReader();r.onload=()=>{try{load(JSON.parse(r.result));dirty=false;$('msg').textContent='loaded '+e.target.files[0].name}catch{alert('That file is not valid JSON.')}};r.readAsText(e.target.files[0]);e.target.value=''};
$('dl').onclick=()=>{const a=h('a',{href:URL.createObjectURL(new Blob([JSON.stringify(D,null,2)+'\n'],{type:'application/json'})),download:'data.json'});a.click();dirty=false;$('msg').textContent='downloaded'};
$('copy').onclick=()=>navigator.clipboard.writeText(JSON.stringify(D,null,2)).then(()=>$('msg').textContent='copied');
window.onbeforeunload=e=>dirty?(e.preventDefault(),''):undefined;

fetch('data.json?t='+Date.now()).then(r=>r.json()).then(load).catch(()=>{load({});$('msg').textContent='no data.json found: use Open JSON'});
</script>
</body>
</html>
